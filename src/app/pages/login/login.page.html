<ion-content>
  <div class="header-section">
    <div class="welcome-text">
      <h2>Connexion</h2>
      <p>Accès sécurisé SIRH</p>
    </div>
  </div>

  <div class="login-form">
    <ion-list lines="none">
      <div class="input-group">
        <ion-label>MATRICULE</ion-label>
        <ion-item>
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input type="text" placeholder="Ex: FUN-001"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <ion-label>MOT DE PASSE</ion-label>
        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password" placeholder="••••••••"></ion-input>
        </ion-item>
      </div>
    </ion-list>

    <ion-button expand="block" (click)="onLogin()" class="login-btn">
      SE CONNECTER
    </ion-button>
    
    <div class="forgot-pwd">
      <p>Problème d'accès ? <span>Contactez la RH</span></p>
    </div>
  </div>
</ion-content>
